<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette Generator · Stratum Tools</title>
  <link rel="stylesheet" href="shared/style.css">
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .palette-container {
      display: flex;
      flex: 1;
      width: 100%;
    }
    .color-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 10px;
      transition: background 0.3s ease;
      position: relative;
    }
    .hex-code {
      font-family: monospace;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.2);
      transition: transform 0.1s, background 0.2s;
    }
    .hex-code:hover {
      transform: scale(1.05);
      background: rgba(0, 0, 0, 0.4);
    }
    .btn-lock {
      background: rgba(0, 0, 0, 0.2);
      border: none;
      font-size: 1.2rem;
      padding: 10px;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.2s;
      cursor: pointer;
    }
    .btn-lock:hover {
      background: rgba(0, 0, 0, 0.4);
    }
    .controls-bar {
      padding: 1rem 2rem;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    select, .controls-bar button {
      padding: 8px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }
    @media (max-width: 640px) {
      .palette-container {
        flex-direction: column;
      }
      .color-column {
        flex-direction: row;
        padding: 15px 20px;
      }
      .controls-bar {
        padding: 0.75rem 1rem;
      }
    }
  </style>
</head>
<body>
  <header></header>
  
  <div class="controls-bar">
    <select id="harmonyMode">
      <option value="random">Random Mode</option>
      <option value="analogous">Analogous</option>
      <option value="complementary">Complementary</option>
      <option value="monochromatic">Monochromatic</option>
    </select>
    <button class="btn-primary" id="generateBtn">Generate Palette</button>
    <p style="font-size: 0.75rem; color: var(--text-muted); align-self: center; margin-left: 10px; display: none;" class="desktop-only">Press Space to Generate</p>
  </div>

  <div class="palette-container" id="paletteContainer"></div>

  <script src="shared/app.js"></script>
  <script>
    const paletteContainer = document.getElementById('paletteContainer');
    const generateBtn = document.getElementById('generateBtn');
    const harmonyModeSelect = document.getElementById('harmonyMode');

    let colors = [
      { hex: '#3b82f6', locked: false },
      { hex: '#818cf8', locked: false },
      { hex: '#c084fc', locked: false },
      { hex: '#f472b6', locked: false },
      { hex: '#fb7185', locked: false }
    ];

    function hslToHex(h, s, l) {
      l /= 100;
      const a = s * Math.min(l, 1 - l) / 100;
      const f = n => {
        const k = (n + h / 30) % 12;
        const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
        return Math.round(255 * color).toString(16).padStart(2, '0');
      };
      return `#${f(0)}${f(8)}${f(4)}`;
    }

    function getTextColor(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      const brightness = (r * 299 + g * 587 + b * 114) / 1000;
      return brightness > 128 ? '#0f172a' : '#f8fafc';
    }

    function generateRandomHex() {
      const letters = '0123456789abcdef';
      let color = '#';
      for (let i = 0; i < 6; i++) {
        color += letters[Math.floor(Math.random() * 16)];
      }
      return color;
    }

    function generatePalette() {
      const mode = harmonyModeSelect.value;
      const baseHue = Math.floor(Math.random() * 360);

      colors = colors.map((item, index) => {
        if (item.locked) return item;
        let newHex = '';
        if (mode === 'analogous') {
          const hue = (baseHue + (index * 25)) % 360;
          newHex = hslToHex(hue, 70, 60);
        } else if (mode === 'monochromatic') {
          const lightness = 25 + (index * 15);
          newHex = hslToHex(baseHue, 65, lightness);
        } else if (mode === 'complementary') {
          const hue = index < 3 ? baseHue + (index * 15) : (baseHue + 180 + (index * 15)) % 360;
          newHex = hslToHex(hue, 70, 55);
        } else {
          newHex = generateRandomHex();
        }
        return { hex: newHex, locked: false };
      });
      renderPalette();
    }

    function toggleLock(index) {
      colors[index].locked = !colors[index].locked;
      renderPalette();
    }

    function renderPalette() {
      paletteContainer.innerHTML = '';
      colors.forEach((color, index) => {
        const textColor = getTextColor(color.hex);
        const col = document.createElement('div');
        col.className = 'color-column';
        col.style.backgroundColor = color.hex;
        col.style.color = textColor;
        col.innerHTML = `
          <button class="btn-lock" style="color: ${textColor}" onclick="toggleLock(${index})">
            ${color.locked ? '🔒' : '🔓'}
          </button>
          <div class="color-info">
            <span class="hex-code" id="hex-${index}">${color.hex.toUpperCase()}</span>
          </div>
        `;
        col.querySelector(`#hex-${index}`).addEventListener('click', (e) => {
          copyToClipboard(color.hex, e.target);
        });
        paletteContainer.appendChild(col);
      });
    }

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target.tagName !== 'SELECT' && e.target.tagName !== 'INPUT') {
        e.preventDefault();
        generatePalette();
      }
    });

    generateBtn.addEventListener('click', generatePalette);
    harmonyModeSelect.addEventListener('change', generatePalette);
    generatePalette();
  </script>
</body>
</html>
